name: Build Windows App
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip Source Code
        run: Expand-Archive -Path asphalt_ticket_app.zip -DestinationPath . -Force
        
      - name: Move files to root if nested
        run: |
          if (Test-Path "asphalt_ticket_app") {
            Move-Item -Path "asphalt_ticket_app\*" -DestinationPath "." -Force
          }
      
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          
      - name: Enable Windows Desktop
        run: flutter config --enable-windows-desktop
        
      - name: Get Packages
        run: flutter pub get
        
      - name: Build Windows Release
        run: flutter build windows --release
        
      - name: Archive Production Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Windows-Direct-App
          path: build\windows\x64\runner\Release\
